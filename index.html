<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b120d">
  <title>Sabor &amp; Cia — Tycoon de Restaurante</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🍽️</div>
        <div class="brand-text">
          <h1>Sabor <em>&amp;</em> Cia</h1>
          <span>Tycoon de Restaurante</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat money" id="stat-money">
          <span class="stat-ico">💵</span>
          <div><b id="hud-money">R$ 1.100</b><small>caixa</small></div>
        </div>
        <div class="stat">
          <span class="stat-ico">⭐</span>
          <div><b id="hud-stars">3,0</b><div class="stars" id="hud-stars-icons"></div></div>
        </div>
        <div class="stat">
          <span class="stat-ico">📅</span>
          <div><b id="hud-day">Dia 1 · Seg</b><small id="hud-clock">11:00</small></div>
        </div>
        <div class="stat level-stat">
          <span class="stat-ico">🎖️</span>
          <div><b>Nível <span id="hud-level">1</span></b><div class="xpbar"><i id="hud-xp"></i></div></div>
        </div>
      </div>

      <div class="controls">
        <button id="btn-pause" class="icon-btn" title="Pausar (espaço)" aria-label="Pausar">⏸</button>
        <div class="speed-group" role="group" aria-label="Velocidade do jogo">
          <button data-speed="1" class="speed-btn active" title="Velocidade normal">1×</button>
          <button data-speed="2" class="speed-btn" title="Rápido">2×</button>
          <button data-speed="4" class="speed-btn" title="Muito rápido">4×</button>
        </div>
        <button id="btn-sound" class="icon-btn" title="Ligar/desligar som" aria-label="Som">🔊</button>
        <button id="btn-help" class="icon-btn" title="Como jogar" aria-label="Ajuda">?</button>
      </div>
    </header>

    <main class="layout">
      <section class="stage">
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="game" width="960" height="600" aria-label="Salão do restaurante Sabor &amp; Cia"></canvas>

          <div class="event-ribbon" id="event-ribbon" hidden>
            <span class="event-emoji" id="event-emoji">🍻</span>
            <div><b id="event-title">Happy Hour</b><span id="event-desc"></span></div>
          </div>

          <div class="stage-chips">
            <span class="chip" id="chip-customers">👥 0</span>
            <span class="chip" id="chip-queue">⏳ 0 na fila</span>
            <span class="chip" id="chip-dirt">🧽 8%</span>
            <span class="chip" id="chip-staff">🧑‍🍳 2</span>
          </div>

          <div class="toasts" id="toasts" aria-live="polite"></div>
        </div>

        <div class="actionbar">
          <button id="btn-clean" class="action-btn">
            <span>🧹 Limpar salão</span><b>R$ 30</b>
          </button>
          <div class="ticker" id="ticker">
            <span class="ticker-ico">🍽️</span><span class="ticker-text">Bem-vindo ao Sabor &amp; Cia!</span>
          </div>
          <button id="btn-newday" class="action-btn gold" hidden>Abrir o dia</button>
        </div>
      </section>

      <aside class="sidebar">
        <nav class="tabs" id="tabs" aria-label="Painel de gestão">
          <button data-tab="menu" class="active">🍽️ Cardápio</button>
          <button data-tab="staff">👥 Equipe</button>
          <button data-tab="upgrades">⬆️ Melhorias</button>
          <button data-tab="goals">🎯 Metas</button>
          <button data-tab="reviews">⭐ Resenhas</button>
        </nav>
        <div class="tab-body" id="tab-body"></div>
      </aside>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="tooltip" role="tooltip"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
